<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>SHA-269 — Turnabout Interview Mode (preview)</title>
<style>
  :root {
    --bg-primary: #F5EDE0;
    --bg-dark: #111111;
    --text-primary: #1A1A1A;
    --text-inverse: #F5EDE0;
    --accent: #E8351A;
    --accent-warm: #FF8C52;
    --muted: #8A8A8A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg-primary);
    font-family: -apple-system, "DM Sans", Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding: 40px 20px 80px;
  }
  .label {
    position: fixed;
    top: 20px;
    left: 20px;
    font-family: "DM Mono", monospace;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    background: rgba(255,255,255,0.6);
    padding: 6px 10px;
    border-radius: 6px;
  }
  .context {
    max-width: 420px;
    text-align: center;
    color: var(--text-primary);
    margin-bottom: 48px;
    opacity: 0.6;
    font-size: 14px;
  }
  .turnabout-card {
    width: min(360px, calc(100vw - 32px));
    border-radius: 20px;
    padding: 16px 18px;
    background: linear-gradient(135deg, rgba(18,15,14,0.97), rgba(34,22,18,0.97));
    box-shadow: 0 12px 40px rgba(232,53,26,0.28), inset 0 1px 0 rgba(255,255,255,0.06);
    border: 1px solid rgba(232,53,26,0.55);
    margin-bottom: 14px;
    color: var(--text-inverse);
  }
  .turnabout-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: "DM Mono", monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent-warm);
    margin-bottom: 8px;
  }
  .turnabout-tag::before { content: "✦"; }
  .turnabout-question {
    font-size: 16px;
    line-height: 1.4;
    font-weight: 500;
  }
  .command-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: min(300px, calc(100vw - 32px));
    min-height: 48px;
    padding: 8px 16px;
    border-radius: 999px;
    background: linear-gradient(135deg, rgba(18,15,14,0.97), rgba(34,22,18,0.97));
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.14);
    color: var(--text-inverse);
    font-size: 14px;
  }
  .s-badge {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700;
    flex-shrink: 0;
  }
  .cb-center { flex: 1; opacity: 0.85; }
  .cb-icon { width: 20px; height: 20px; flex-shrink: 0; opacity: 0.8; }
</style>
</head>
<body>
  <div class="label">SHA-269 — minimal mockup, not final</div>
  <div class="context">Command bar, idle state, after a couple of exchanges — the agent surfaces a distinct "turnabout" card above the bar before asking its own question.</div>

  <div class="turnabout-card">
    <div class="turnabout-tag">Got a question for you</div>
    <div class="turnabout-question">"What's the hardest part of your role right now?"</div>
  </div>

  <div class="command-bar">
    <div class="s-badge">S</div>
    <div class="cb-center">Listening for your answer…</div>
    <svg class="cb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="9" y="9" width="6" height="6" rx="1"/>
    </svg>
  </div>
</body>
</html>
